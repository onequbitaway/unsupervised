[workspace]
resolver = "3"
members = [
    "crates/protocol",
    "crates/kernel",
    "crates/modules/life",
    "crates/modules/economy",
    "crates/modules/finance",
    "crates/modules/society",
    "crates/modules/crime",
    "crates/modules/politics",
    "crates/modules/missions",
    "crates/runtime",
    "crates/store",
    "crates/gateway",
    "crates/spectator",
    "crates/server",
    "crates/loadtest",
    "crates/scenarios",
    "crates/e2e",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/onequbitaway/unsupervised"
publish = false

[workspace.dependencies]
# Internal crates
unsup-protocol = { path = "crates/protocol" }
unsup-kernel = { path = "crates/kernel" }
unsup-runtime = { path = "crates/runtime" }
unsup-store = { path = "crates/store" }
unsup-gateway = { path = "crates/gateway" }
unsup-spectator = { path = "crates/spectator" }
unsup-life = { path = "crates/modules/life" }
unsup-economy = { path = "crates/modules/economy" }
unsup-finance = { path = "crates/modules/finance" }
unsup-society = { path = "crates/modules/society" }
unsup-crime = { path = "crates/modules/crime" }
unsup-politics = { path = "crates/modules/politics" }
unsup-missions = { path = "crates/modules/missions" }
unsup-server = { path = "crates/server" }

# External crates. Versions are pinned in Cargo.lock.
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws", "macros"] }
blake3 = "1.8.7"
clap = { version = "=4.6.7", features = ["derive", "env"] }
futures = "0.3.34"
getrandom = "0.4.3"
hdrhistogram = "7.6.0"
hex = "0.4.3"
rayon = "1.12.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
rmp-serde = "1.3.1"
rusqlite = { version = "=0.42.0", features = ["bundled"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = "0.30.0"
toml = "1.2.1"
tower-http = { version = "0.7.1", features = ["cors", "fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 4
debug = "line-tables-only"

[profile.bench]
lto = "thin"
