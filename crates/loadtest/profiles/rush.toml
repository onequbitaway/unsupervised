# Rush: a stress load. Every resident takes short walks with almost no think
# time. One cycle is about 3.3 ticks, so one million residents send about
# 300,000 actions in each frame. Use it to prove the target of 200,000
# actions for each second.

name = "rush"
summary = "Residents take short walks with almost no think time."

observe_share = 0.1
wait_share = 1.0

[think]
kind = "uniform"
min = 0
max = 2

[[action]]
verb = "move_to"
weight = 19
args = { gen = "near_tile", radius = 3 }

[[action]]
verb = "wait"
weight = 1
args = { ticks = { gen = "int", min = 1, max = 2 } }
