# Sprint: a stress load for the rate of actions over the network. Every
# resident takes walks of one or two tiles and pauses of one tick. An agent
# of the swarm never waits for the end of an action, and it looks at the
# world after one action in fifty.
#
# Use it with `swarm --acks-only` and a short think time to find the
# greatest rate of actions that a server acknowledges. An agent that sends
# more actions than its resident can do fills the queue of the resident
# (`kernel.queue_max`); the world then rejects the next actions with
# `queue_full`. With `--tick-ms 100` a resident ends up to ten actions in
# one second.

name = "sprint"
summary = "Residents take very short walks and pauses. Agents never wait for the end of an action and almost never look."

observe_share = 0.02
wait_share = 0.0

# Ticks between the end of one action and the next action (bench and soak).
[think]
kind = "uniform"
min = 0
max = 1

[[action]]
verb = "move_to"
weight = 1
args = { gen = "near_tile", radius = 2 }

[[action]]
verb = "wait"
weight = 1
args = { ticks = 1 }
