# Balance numbers of the politics module. See docs/design/architecture.md, section 7.
# docs/design/modules/politics.md says how the module uses each number.
#
# Money is in cents. A day is a game day of 1,440 game minutes.

# ---- Calendar ---------------------------------------------------------------

[params."politics.city_term_days"]
value = 14
min = 1
max = 365
policy = false
summary = "Game days between two regular elections of a city."

[params."politics.nation_term_days"]
value = 28
min = 1
max = 365
policy = false
summary = "Game days between two regular elections of the nation."

[params."politics.city_first_vote_day"]
value = 3
min = 1
max = 365
policy = false
summary = "Day of the world, from 1, of the first voting day of every city."

[params."politics.nation_first_vote_day"]
value = 5
min = 1
max = 365
policy = false
summary = "Day of the world, from 1, of the first voting day of the nation."

[params."politics.registration_days"]
value = 1
min = 1
max = 28
policy = false
summary = "Game days that the registration window of an election lasts."

[params."politics.campaign_days"]
value = 1
min = 0
max = 28
policy = false
summary = "Game days between the end of the registration window and the voting day."

[params."politics.polls_open_minute"]
value = 360
min = 0
max = 1439
policy = false
summary = "Minute of the voting day at which the polls open."

[params."politics.polls_close_minute"]
value = 1200
min = 1
max = 1440
policy = false
summary = "Minute of the voting day at which the polls close and the votes are counted."

