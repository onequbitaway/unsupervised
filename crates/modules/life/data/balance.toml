# Balance numbers of the life module. See docs/design/architecture.md, section 7,
# and docs/design/modules/life.md for the formulas that use them.
#
# Money is in cents. One tick is one game minute. Needs go from 0 to 1000.

# ---- World generation -------------------------------------------------------
#
# The tables below use one line for each number. Each line is a normal
# parameter.

[params]
# Layout of a district.
"life.gen.block" = { value = 14, min = 5, max = 64, summary = "Side of one city block in tiles." }
"life.gen.street" = { value = 2, min = 1, max = 4, summary = "Width of a street between two blocks in tiles." }
