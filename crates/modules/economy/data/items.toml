# The goods catalogue. The format is that of `data/balance.toml`
# (docs/design/architecture.md, section 7).
#
# Tags that other modules read: `food` (with `nutrition`), `medicine` (with
# `healing`), `contraband`. `base_price` is the normal price of one unit in
# cents. It is a guide for residents; no rule uses it.

# ---- Raw goods ---------------------------------------------------------------

[[items]]
name = "grain"
weight = 1
tags = ["raw"]
attrs = { base_price = 200 }
summary = "Grain from a farm. An input for bread, meals and moonshine."

[[items]]
name = "vegetables"
weight = 1
tags = ["raw", "food"]
attrs = { base_price = 300, nutrition = 120 }
summary = "Vegetables from a farm. Food, and an input for meals."

[[items]]
name = "cotton"
weight = 1
tags = ["raw"]
attrs = { base_price = 250 }
summary = "Cotton from a farm. An input for cloth."

[[items]]
name = "herbs"
weight = 1
tags = ["raw"]
attrs = { base_price = 400 }
summary = "Herbs from a forest. An input for medicine."

[[items]]
name = "wood"
weight = 3
tags = ["raw"]
attrs = { base_price = 300 }
summary = "Wood from a forest. An input for tools and furniture."

[[items]]
name = "ore"
weight = 4
tags = ["raw"]
attrs = { base_price = 500 }
summary = "Ore from a mine. An input for metal."

