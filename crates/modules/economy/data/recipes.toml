# Recipes. A recipe turns the inputs in the stock of a site into outputs in
# the stock of the same site.
#
# name       the name that `produce` and `post_job` use
# sites      the site kinds where the recipe works
# skill      the skill that the recipe uses and trains
# min_level  the least level in that skill
# minutes    game minutes for one batch at the least level
# inputs     goods that one batch uses
# outputs    goods that one batch makes

[[recipes]]
name = "bread"
sites = ["restaurant", "factory"]
skill = "cooking"
min_level = 0
minutes = 20
inputs = { grain = 2 }
outputs = { bread = 1 }

