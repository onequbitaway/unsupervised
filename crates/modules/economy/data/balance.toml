# Balance numbers of the economy module. See docs/design/architecture.md,
# section 7, and docs/design/modules/economy.md for the formulas.
#
# Money is in cents. Rates are basis points (1/10,000). The goods are in
# `items.toml`, the recipes in `recipes.toml`, the site kinds in
# `sites.toml` and the depot prices in `depot.toml`.

# ---- Work --------------------------------------------------------------------

[params."economy.shift_minutes"]
value = 240
min = 10
max = 720
policy = true
summary = "Game minutes that one `work` shift lasts."

[params."economy.min_wage"]
value = 0
min = 0
max = 1000000
policy = true
summary = "Least wage in cents for one shift that `post_job` accepts."

[params."economy.wage_max"]
value = 10000000
min = 1
max = 1000000000
policy = false
summary = "Greatest wage in cents for one shift that `post_job` accepts."

