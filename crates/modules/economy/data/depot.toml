# Prices of the depot: the buyer and seller of last resort. Each entry
# becomes two policy parameters, `economy.depot_floor.<item>` and
# `economy.depot_ceiling.<item>`, so a law or an override file can change
# them. The depot does not trade a good that is not in this file.
#
# floor    cents that the depot pays for one unit (faucet `export.sale`)
# ceiling  cents that one unit costs at the depot (sink `import.purchase`)
#
# Keep every chain a loss through the depot: the inputs of a recipe at the
# ceiling must cost more than its outputs give at the floor.

[[depot]]
item = "grain"
floor = 80
ceiling = 500

[[depot]]
item = "vegetables"
floor = 120
ceiling = 750

