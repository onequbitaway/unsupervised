# Balance numbers of the missions module. See docs/design/architecture.md, section 7.
# docs/design/modules/missions.md says how the module uses each number.
# Money is in cents. Shares are in basis points (1/10,000). Times are in game
# minutes; one frame is one game minute.

# ---- The definition of a mission ------------------------------------------------

[params."missions.title_max"]
value = 80
min = 1
max = 400
policy = false
summary = "Greatest length of the title of a mission, in bytes."

[params."missions.text_max"]
value = 1000
min = 0
max = 4000
policy = false
summary = "Greatest length of the text of a mission, in bytes."

[params."missions.objectives_max"]
value = 4
min = 1
max = 16
policy = false
summary = "Greatest number of objectives of one mission."

[params."missions.match_max"]
value = 4
min = 0
max = 16
policy = false
summary = "Greatest number of data fields that one objective compares."

[params."missions.event_kind_max"]
