# Balance numbers of the crime module. See docs/design/architecture.md, section 7,
# and docs/design/modules/crime.md for the formulas that use them.
#
# Money is in cents. One tick is one game minute. A chance is in basis points
# (1/10,000). Health goes from 0 to 1000. A parameter with `policy = true` can
# be changed by a law, for the nation or for one city.

[params]

# ---- All crimes ----------------------------------------------------------------

"crime.chance_min_bp" = { value = 500, min = 0, max = 10000, summary = "Least chance that a crime or an investigation works." }
"crime.chance_max_bp" = { value = 9500, min = 0, max = 10000, summary = "Greatest chance that a crime or an investigation works." }
"crime.night_from_hour" = { value = 22, min = 0, max = 23, summary = "First hour of the night." }
"crime.night_to_hour" = { value = 6, min = 0, max = 23, summary = "First hour of the day." }
