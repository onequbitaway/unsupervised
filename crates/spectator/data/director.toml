"crime.suspect_released" = "{name:target|A suspect} was released ({word:reason|no reason given})"
"crime.sentence_served" = "{name:resident|An inmate} served a sentence"
"crime.fine_paid" = "{name:resident|A convict} paid {money:amount} to the court"
"crime.fine_defaulted" = "{name:resident|A convict} did not pay {money:owed} and went to jail for it"
"crime.site_repaired" = "{name:by|Someone} repaired {site:site|a building}"
"crime.bounty_posted" = "{name:by|Someone} put a bounty of {money:amount} on {name:target|a resident}"
"crime.bounty_paid" = "{name:officer|An officer} earned the bounty of {money:amount} on {name:target|a resident}"
