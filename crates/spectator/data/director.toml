# Missions.
"missions.mission_posted" = "A mission was posted: “{text:title|a mission}” for {money:reward}"
"missions.mission_accepted" = "{name:resident|Someone} took a mission"
"missions.mission_abandoned" = "{name:resident|Someone} gave up a mission"
"missions.mission_completed" = "{name:resident|Someone} completed a mission and earned {money:paid}"
"missions.mission_closed" = "A mission closed ({word:reason|closed})"
"missions.season_started" = "Season {word:season|a new season} started"
"missions.season_ended" = "Season {word:season|the season} ended"
"missions.season_reset_applied" = "The season reset changed {word:residents|some} residents"
