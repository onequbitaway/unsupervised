# Numbers of the showcase world (`cargo run -p unsup-spectator --example
# showcase`). The showcase is a tool for work on the viewer. It is not the
# game.

[walk]
# Chance in 1,000 per tick that an idle resident starts a new walk.
start_per_mille = 60
# Chance in 100 that a new walk leads to a neighbour district.
leave_zone_percent = 8
# Longest path of one walk, in tiles.
max_path = 160

[driver]
# One resident in this many gets a request in each frame.
one_in = 25
# Weights of the requests. The driver draws one by weight.
work = 300
eat = 120
rest = 120
sleep = 60
train = 60
say = 300
rob = 14
marry = 6
open_business = 6
die = 3
# Shortest and longest duration of a busy action, in ticks.
min_ticks = 8
max_ticks = 45
# Frames between two elections.
election_every = 240

[drama]
# Drama scores of the events of the showcase (docs/design/game-design.md, 6).
said = 3
shift_completed = 5
business_opened = 25
married = 30
theft_committed = 55
resident_died = 75
election_decided = 85

[plots]
# Frames between two crimes with an investigation, an arrest and a trial.
crime_every = 70
# Frames from the crime to the investigation, the arrest and the trial.
investigation_after = 10
arrest_after = 30
trial_after = 55
# Frames between two feuds, and between the three events of one feud.
feud_every = 110
feud_step = 18
# Frames between two bankruptcies, and between their three events.
bankruptcy_every = 150
bankruptcy_step = 14
# Frames between two residents that get a job or a home.
career_every = 9
# Frames before an election in which the candidates register.
campaign_frames = 80
# Candidates of one election.
candidates = 3
# Frames between two publications of the statistics and of the boards.
stats_every = 30
boards_every = 45
# Rows of one board.
board_rows = 8

[plot_drama]
# Drama scores of the events of the plots.
investigation_opened = 30
arrest_made = 50
trial_ended = 60
heist_committed = 80
opinion_given = 14
contract_breached = 40
loan_defaulted = 60
property_foreclosed = 55
tenant_evicted = 45
worker_hired = 12
lease_started = 12
candidate_registered = 20
